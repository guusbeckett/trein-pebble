<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trein (Stef) settings</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; margin-top: 4px; }
    textarea { min-height: 80px; font-family: monospace; }
    button { margin-top: 16px; padding: 10px 16px; font-size: 16px; }
    p { color: #444; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Trein (Stef)</h1>
  <p>NS key is required. OpenRouteService is optional: without it VERTREK still works and OVER waits.</p>
  <label>NS API key
    <input id="api_key" type="text" autocomplete="off">
  </label>
  <label>OpenRouteService API key
    <input id="routing_api_key" type="text" autocomplete="off">
  </label>
  <label>Station offsets JSON (station_code to extra minutes)
    <textarea id="station_offsets" placeholder='{"Ut": 2, "Asd": 1}'></textarea>
  </label>
  <label>Favourites JSON
    <textarea id="favourites" placeholder='[{"code":"Ut","name":"Utrecht C"}]'></textarea>
  </label>
  <button id="save">Save</button>
  <script>
    function qp(name) {
      var q = location.search.substring(1).split("&");
      for (var i = 0; i < q.length; i++) {
        var p = q[i].split("=");
        if (decodeURIComponent(p[0]) === name) return decodeURIComponent(p.slice(1).join("="));
      }
      return "";
    }
    document.getElementById("api_key").value = qp("api_key");
    document.getElementById("routing_api_key").value = qp("routing_api_key");
    document.getElementById("station_offsets").value = qp("station_offsets") || "{}";
    document.getElementById("favourites").value = qp("favourites") || "[]";
    document.getElementById("save").onclick = function() {
      var offsets = document.getElementById("station_offsets").value || "{}";
      try { JSON.parse(offsets); } catch (e) { alert("Station offsets must be JSON"); return; }
      var favs = document.getElementById("favourites").value || "[]";
      var favourites;
      try { favourites = JSON.parse(favs); } catch (e) { alert("Favourites must be JSON"); return; }
      var result = {
        api_key: document.getElementById("api_key").value,
        routing_api_key: document.getElementById("routing_api_key").value,
        station_offsets: offsets,
        favourites: favourites
      };
      document.location = "pebblejs://close#" + encodeURIComponent(JSON.stringify(result));
    };
  </script>
</body>
</html>
